# Yu Gateway + New API — 生产 Nginx 配置
# 使用方法：替换 996tokens.com 为你的真实域名，然后用 docker compose -f docker-compose.prod.yml 启动

# 强制 HTTP → HTTPS
server {
    listen 80;
    server_name 996tokens.com www.996tokens.com api.996tokens.com app.996tokens.com;
    return 308 https://$host$request_uri;
}

# 官网（Yu Gateway）
server {
    listen 443 ssl;
    http2 on;
    server_name 996tokens.com www.996tokens.com;

    ssl_certificate     /etc/nginx/certs/996tokens.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/996tokens.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全 Headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 流式响应：禁用缓冲（SSE / streaming chat 必须）
    proxy_buffering off;
    proxy_cache off;

    client_max_body_size 16m;

    # 生产 API 由 New API 承接，官网域名不开放本地演示网关接口。
    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass         http://yu-gateway:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# 用户后台 + API 调用（New API）
server {
    listen 443 ssl;
    http2 on;
    server_name app.996tokens.com api.996tokens.com;

    ssl_certificate     /etc/nginx/certs/996tokens.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/996tokens.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 16m;

    # 根路径直接跳登录/控制台，隐藏 New API 默认宣传首页
    location = / {
        return 302 https://$host/console;
    }

    # 已登录用户点击「文档」时留在 app 域名，展示后台语境的品牌内容。
    location = /docs {
        proxy_pass         http://yu-gateway:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /docs/ {
        proxy_pass         http://yu-gateway:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass         http://new-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
